title: "[Exercise] "
labels: ["exercise-idea"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an exercise for the app's catalog. Say what it should train and at which level. If you have a score or a pattern in mind, attach it or describe it. Ideas that make it into the catalog are published in the app and here, so the form asks for your permission at the end.
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - Beginner
        - Intermediate
        - Advanced
        - Not sure
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What should it train?
      description: The skill, in your words. "Keeping the left hand steady while the right hand plays eighth notes", "reading ledger lines below the bass clef", "a scale in E flat major"...
    validations:
      required: true
  - type: dropdown
    id: hands
    attributes:
      label: Hands
      options:
        - Both hands
        - Right hand
        - Left hand
        - Hands separately, then together
    validations:
      required: false
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: A pattern, a public domain piece, or a MusicXML file of your own dragged here. Optional. Do not attach copyrighted music, scans of method books or editions you do not own.
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: Why this one?
      description: What you tried in the app and where it fell short. Optional, but it helps.
    validations:
      required: false
  - type: checkboxes
    id: permission
    attributes:
      label: Permission
      options:
        - label: If this idea becomes an exercise, it may be published in the app and in this repository under CC BY 4.0, adapted as needed. Credit is welcome but not required.
          required: true
        - label: Anything I attach is my own work or public domain. It is not a copyrighted song, arrangement, edition or method book page.
          required: true
