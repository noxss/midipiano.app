labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Features, changes, or an exercise you miss in the catalog. For an exercise, say the level and what it should train.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The situation, not only the feature. "I want to practice a piece a tone lower because I sing along" says more than "add transposition".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
    validations:
      required: false
